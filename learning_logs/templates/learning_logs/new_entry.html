{% extends "learning_logs/base.html" %}
{% block page_header %}
    <h1>Add a new entry</h1>
{% endblock page_header %}
{% block content %}
    <p><a href="{% url 'learning_logs:topic' topic.id %}">{{ topic }}</a></p>
    <form action="{% url 'learning_logs:new_entry' topic.id %}" method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button class="btn btn-primary" name="submit">Add entry</button>
        <a class="btn btn-outline-secondary" href="{% url 'learning_logs:topic' topic.id %}">Cancel</a>
    </form>
{% endblock content %}
